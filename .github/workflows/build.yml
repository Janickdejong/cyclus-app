name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: PDF-bibliotheek en lettertypes ophalen
        run: |
          WWW=app/src/main/assets/www
          mkdir -p $WWW/lib $WWW/fonts
          curl -fsSL -o $WWW/lib/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          for f in cormorant-garamond-latin-500-normal cormorant-garamond-latin-600-normal cormorant-garamond-latin-500-italic; do
            curl -fsSL -o $WWW/fonts/$f.woff2 https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/files/$f.woff2 || echo "Lettertype $f niet gevonden"
          done
          for f in fraunces-latin-500-normal fraunces-latin-600-normal fraunces-latin-700-normal; do
            curl -fsSL -o $WWW/fonts/$f.woff2 https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5/files/$f.woff2 || echo "Lettertype $f niet gevonden"
          done
          ls -la $WWW/lib $WWW/fonts

      - name: APK bouwen
        run: gradle assembleDebug --no-daemon

      - name: APK klaarzetten als download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cyclus.apk
          gh release create "build-${{ github.run_number }}" Cyclus.apk --title "Cyclus build ${{ github.run_number }}" --notes "Download Cyclus.apk en installeer hem. Updates gaan over de vorige versie heen; de gegevens blijven staan."
